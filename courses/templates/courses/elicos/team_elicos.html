{% load static wagtailcore_tags wagtailimages_tags %}

<div class="container mx-auto mb-10 w-full">
    <div class="mt-4 lg:mt-8">
        <div class="mx-auto w-full">

            <div 
                x-data="{ 
                    showModal: false,
                    selectedMember: {
                        name: '',
                        position: '',
                        qualification: '',
                        image: '',
                        description: ''
                    }
                }"
            >

                <!-- ELICOS Team -->
                <div>
                    {% include 'about/components/team.html' with team_title=page.team_title team=page.elicos_team team_id="el" %}
                </div>

                <!-- Modal -->
                <div 
                    x-show="showModal" 
                    x-transition 
                    class="fixed inset-0 z-50 overflow-y-auto"
                    style="display: none;"
                >

                    <!-- Modal backdrop -->
                    <div 
                        class="fixed inset-0 bg-black bg-opacity-50 transition-opacity"
                        @click="showModal = false"
                    ></div>

                    <!-- Modal content -->
                    <div class="relative min-h-screen flex items-center justify-center p-4">

                        <div 
                            class="relative bg-white rounded-lg shadow-xl max-w-6xl w-full mx-auto"
                            @click.away="showModal = false"
                        >

                            <!-- Close button -->
                            <button 
                                @click="showModal = false"
                                class="absolute right-4 top-4 text-gray-500 hover:text-gray-700"
                            >
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                                </svg>
                            </button>

                            <!-- Modal body -->
                            <div class="flex flex-col md:flex-row p-6 lg:p-10">

                                <div class="w-full mt-6 md:mt-0 md:pl-6 text-sm">

                                    <div class="mb-4 bg-gray-100 p-4 border rounded-lg shadow-sm">

                                        <div class="flex flex-col md:flex-row">

                                            <div class="w-full md:w-4/12">
                                                <div class="flex flex-col items-center jusitfy-center">

                                                    <img 
                                                        :src="selectedMember.image" 
                                                        class="w-40 h-40 lg:h-52 lg:w-52 rounded-full object-cover mb-4 drop-shadow-lg border"
                                                        :alt="selectedMember.name"
                                                    >

                                                </div>
                                            </div>

                                            <div class="w-full md:w-8/12">

                                                <div class="flex flex-col">

                                                    <h3 class="text-xl lg:text-2xl font-semibold mb-2" x-text="selectedMember.name"></h3>

                                                    <hr>

                                                    <div class="flex flex-col md:flex-row mt-4 mb-2">
                                                        <div class="w-full md:w-4/12 lg:w-3/12">Position</div>
                                                        <div class="w-full md:w-8/12 lg:w-9/12" x-html="selectedMember.position"></div>
                                                    </div>

                                                    <div class="flex flex-col md:flex-row">
                                                        <div class="w-full md:w-4/12 lg:w-3/12">Qualification</div>
                                                        <div class="w-full md:w-8/12 lg:w-9/12" x-html="selectedMember.qualification"></div>
                                                    </div>

                                                </div>

                                            </div>

                                        </div>

                                    </div>

                                    <div x-html="selectedMember.description"></div>

                                </div>

                            </div>

                        </div>

                    </div>

                </div>

            </div>

        </div>
    </div>
</div>
