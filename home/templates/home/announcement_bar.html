{% if page.show_announcement and page.announcement_text %}

<style>
.announcement-bar {
    background: #0c3c60;
    color: #fff;
    padding: 10px 0;
    overflow: hidden;
    white-space: nowrap;
    font-size: 14px;
}

.marquee {
    display: inline-block;
    padding-left: 100%;
    animation: scrollText 60s linear infinite;
}

@keyframes scrollText {
    from {
        transform: translateX(0%);
    }
    to {
        transform: translateX(-100%);
    }
}
</style>

<div class="announcement-bar">
    <div class="marquee">
        {{ page.announcement_text }} &nbsp;&nbsp;&nbsp;&nbsp;
        {{ page.announcement_text }}
    </div>
</div>

{% endif %}
