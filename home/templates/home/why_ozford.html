{% load static wagtailcore_tags wagtailimages_tags %}
<div class="container mx-auto bg-gray-100 text-black px-4 py-6 lg:py-8 xl:py-14 xl:px-20">
    <div class="flex flex-col xl:flex-row xl:justify-center xl:gap-10">
      <div class="w-full xl:1/2">
        <h2 class="text-3xl xl:text-5xl font-bold mb-4 lg:mb-8 xl:mb-10">{{ page.about_title }}</h2>
        <div class="hidden lg:flex justify-center gap-12 xl:gap-16 mb-4 xl:mb-8 text-lg font-extrabold text-gray-700 text-center">
          <div class="flex flex-col justify-center items-center space-y-2 w-40 xl:w-44">
            <span>
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-10">
                <path stroke-linecap="round" stroke-linejoin="round" d="M4.26 10.147a60.438 60.438 0 0 0-.491 6.347A48.62 48.62 0 0 1 12 20.904a48.62 48.62 0 0 1 8.232-4.41 60.46 60.46 0 0 0-.491-6.347m-15.482 0a50.636 50.636 0 0 0-2.658-.813A59.906 59.906 0 0 1 12 3.493a59.903 59.903 0 0 1 10.399 5.84c-.896.248-1.783.52-2.658.814m-15.482 0A50.717 50.717 0 0 1 12 13.489a50.702 50.702 0 0 1 7.74-3.342M6.75 15a.75.75 0 1 0 0-1.5.75.75 0 0 0 0 1.5Zm0 0v-3.675A55.378 55.378 0 0 1 12 8.443m-7.007 11.55A5.981 5.981 0 0 0 6.75 15.75v-1.5" />
              </svg>
            </span>
            <p class="leading-snug">Professionally Competent Graduates</p>
          </div>
          <div class="flex flex-col justify-center items-center space-y-2 w-40 xl:w-44">
            <span>
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-10">
              <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75 11.25 15 15 9.75M21 12c0 1.268-.63 2.39-1.593 3.068a3.745 3.745 0 0 1-1.043 3.296 3.745 3.745 0 0 1-3.296 1.043A3.745 3.745 0 0 1 12 21c-1.268 0-2.39-.63-3.068-1.593a3.746 3.746 0 0 1-3.296-1.043 3.745 3.745 0 0 1-1.043-3.296A3.745 3.745 0 0 1 3 12c0-1.268.63-2.39 1.593-3.068a3.745 3.745 0 0 1 1.043-3.296 3.746 3.746 0 0 1 3.296-1.043A3.746 3.746 0 0 1 12 3c1.268 0 2.39.63 3.068 1.593a3.746 3.746 0 0 1 3.296 1.043 3.746 3.746 0 0 1 1.043 3.296A3.745 3.745 0 0 1 21 12Z" />
              </svg>
            </span>
            <p class="leading-snug">Globally Recognised Degree</p>
          </div>
        </div>
        <div class="cms-page">
          {{ page.about_content|richtext }}
        </div>
        <div class="pt-4 xl:pt-6">
            <a href="/about/" class="inline-flex items-center gap-2 px-4 py-2 rounded-none leading-loose tracking-wider text-lg text-white bg-link-primary hover:bg-link-primary-hover transition-all">
                <span>Learn more</span>
                <span>
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M17.25 8.25 21 12m0 0-3.75 3.75M21 12H3" />
                      </svg>
                      
                </span>
              </a>
        </div>  
        
        
      </div>
      <div class="w-full xl:1/2">
        {% image page.about_image original class="w-full h-auto" %}
      </div>
    </div>
  </div>
